openapi: 3.1.0
info:
  title: Phi ChatGPT ↔ Browsallax Relay
  version: 0.2.0
  description: >
    Transport-only relay to the user's local Browsallax semantic agent. The relay grants no browser authority.
    The relay grants no browser authority.
servers:
  - url: https://phi-browsallax-relay.netlify.app
security:
  - bearerAuth: []
paths:
  /v1/bridge/status:
    post:
      operationId: bridge_status_begin
      summary: Queue a bounded bridge status request
      responses:
        "202": { description: Queued }
  /v1/vessie/observe:
    post:
      operationId: vessie_observe_begin
      summary: Queue a bounded Vessie observation
      responses:
        "202": { description: Queued }
  /v1/vessie/ask:
    post:
      operationId: vessie_ask_begin
      summary: Queue one user-authored message for Vessie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [message]
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 8000
      responses:
        "202": { description: Queued }
  /v1/vessie/resume:
    post:
      operationId: vessie_resume_begin
      summary: Queue resume of a previously HELD Vessie task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [taskId]
              properties:
                taskId:
                  type: string
      responses:
        "202": { description: Queued }
  /v1/domistika/status:
    post:
      operationId: domistika_status_begin
      summary: Queue a bounded Domistika status request
      responses:
        "202": { description: Queued }
  /v1/domistika/observe:
    post:
      operationId: domistika_observe_begin
      summary: Queue a bounded Domistika observation
      responses:
        "202": { description: Queued }
  /v1/domistika/draw:
    post:
      operationId: domistika_draw_begin
      summary: Queue one governed Domistika drawing recipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [recipe]
              properties:
                recipe:
                  type: object
                  additionalProperties: false
                  required: [mode, points]
                  properties:
                    projectName: { type: string, maxLength: 120 }
                    newCanvas:
                      type: object
                      additionalProperties: false
                      properties:
                        width: { type: integer, minimum: 64, maximum: 8192 }
                        height: { type: integer, minimum: 64, maximum: 8192 }
                    tool:
                      type: string
                      enum: [pencil, ink, marker, airbrush, eraser]
                    color: { type: string }
                    size: { type: integer, minimum: 1, maximum: 180 }
                    symmetry:
                      type: string
                      enum: [none, vertical, horizontal, quad, radial-6, radial-8, radial-12]
                    mode:
                      type: string
                      enum: [sticky, polyline]
                    points:
                      type: array
                      minItems: 2
                      maxItems: 512
                      items:
                        type: object
                        additionalProperties: false
                        required: [x, y]
                        properties:
                          x: { type: number, minimum: 0, maximum: 1 }
                          y: { type: number, minimum: 0, maximum: 1 }
                    intervalMs: { type: integer, minimum: 0, maximum: 50 }
                    saveToGallery: { type: boolean }
                    gallery: { type: object }
      responses:
        "202": { description: Queued }
  /v1/requests/{id}:
    get:
      operationId: bridge_request_status
      summary: Read the state/result of a queued bridge request
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: Request state/result }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
